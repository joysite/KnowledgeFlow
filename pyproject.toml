[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeflow"
version = "0.1.0"
description = "A local-first intelligent knowledge base with hybrid retrieval and agent tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "aiofiles>=24,<26",
    "chromadb>=1.5,<2.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.30,<2.0",
    "alembic>=1.14,<2.0",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 耗时较长的测试",
]

# 测试覆盖率配置
[tool.coverage.run]
source = ["app"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 0
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
